<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oddsklubben · Admin</title><link rel="stylesheet" href="stats-site/styles.css?v=20261007-1"><style>
.admin{max-width:1050px;margin:35px auto 80px;padding:0 20px}.adminhero{background:#163d27;color:#fff;border-radius:28px;padding:34px}.adminhero h1{margin:5px 0;font-size:clamp(36px,6vw,64px)}.login,.metrics,.panel{margin-top:16px;background:#fffefa;border:1px solid #d9d5c9;border-radius:20px;padding:20px}.login{display:flex;gap:10px}.login input{flex:1;min-width:0;padding:12px;border:1px solid #bbb;border-radius:10px;font:inherit}.login button{border:0;border-radius:10px;padding:12px 18px;background:#163d27;color:#fff;font-weight:800}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.metric{padding:15px;background:#f4f1e8;border-radius:14px}.metric small{display:block;color:#687168}.metric b{font-size:28px}.rows{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid #e4e0d5}.muted{color:#687168}.error{color:#9b2727;font-weight:700}.hidden{display:none}@media(max-width:700px){.metrics{grid-template-columns:1fr 1fr}.login{flex-direction:column}}</style></head><body><main class="admin"><section class="adminhero"><small>ODDSKLUBBEN · PRIVAT</small><h1>Admin</h1><p>Anonim besøgsstatistik for appen og hjemmesiden.</p></section><form class="login" id="login"><input id="key" type="password" autocomplete="current-password" placeholder="Admin-kode" required><button>Åbn statistik</button></form><p id="msg" class="muted"></p><section id="dash" class="hidden"><div class="metrics"><div class="metric"><small>I dag</small><b id="today">–</b></div><div class="metric"><small>7 dage</small><b id="d7">–</b></div><div class="metric"><small>30 dage</small><b id="d30">–</b></div><div class="metric"><small>Alle events</small><b id="total">–</b></div><div class="metric"><small>Unikke enheder*</small><b id="unique">–</b></div></div><section class="panel"><h2>Mest besøgte</h2><div id="pages" class="rows"></div></section><section class="panel"><h2>Seneste aktivitet</h2><div id="recent" class="rows"></div></section><p class="muted">* Anonymt browser-/installations-ID. Det er ikke det samme som identificerede personer.</p></section></main><script>
const API="https://script.google.com/macros/s/AKfycbwt1E1CC6EDlvwmblrzM6vtK4WmYCrmpIhj_SV7NUvMmcsNweZXcr0E4M1X83dvsE7WlQ/exec",form=document.getElementById("login"),msg=document.getElementById("msg"),dash=document.getElementById("dash");
form.onsubmit=async e=>{e.preventDefault();msg.className="muted";msg.textContent="Henter…";dash.classList.add("hidden");try{const key=document.getElementById("key").value.trim(),r=await fetch(API+"?action=analytics&key="+encodeURIComponent(key)),d=await r.json();if(!d.ok)throw new Error(d.error||"Adgang afvist");today.textContent=d.today;d7.textContent=d.last7;d30.textContent=d.last30;total.textContent=d.total;unique.textContent=d.unique;pages.innerHTML=d.pages.map(x=>'<div class="row"><span>'+esc(x.page)+'</span><b>'+x.count+'</b></div>').join("")||'<p class="muted">Ingen data endnu.</p>';recent.innerHTML=d.recent.map(x=>'<div class="row"><span>'+esc(x.page||x.event)+'</span><small>'+fmt(x.time)+'</small></div>').join("")||'<p class="muted">Ingen data endnu.</p>';dash.classList.remove("hidden");msg.textContent=""}catch(err){msg.className="error";msg.textContent=err.message}};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function fmt(s){try{return new Intl.DateTimeFormat("da-DK",{dateStyle:"short",timeStyle:"short"}).format(new Date(s))}catch(e){return s}}
</script></body></html>
