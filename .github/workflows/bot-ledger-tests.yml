name: Bot ledger integrity tests
on:
  pull_request:
    branches: [mobile-round-entry, prototype/bot-ledger-idempotency-20261019]
    paths:
      - 'data/bot-bets.json'
      - 'tests/test_bot_ledger_integrity.py'
      - 'tests/test_bot_ledger_reference.py'
      - 'tests/test_bot_contract_path.py'
      - 'src/bot_ledger_reference.py'
      - '.github/workflows/bot-ledger-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
