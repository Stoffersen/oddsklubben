name: Refresh Team History Cache
on:
  workflow_dispatch:
  schedule:
    - cron: "10 0,6,12,18 * * *"
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Refresh cache
        env:
          FIVE_DOLLAR_FOOTBALL_API_KEY: ${{ secrets.FIVE_DOLLAR_FOOTBALL_API_KEY }}
        run: python -m src.refresh_cache
      - name: Commit cache
        run: |
          git config user.name "oddsklubben-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/team_history.json
          git diff --cached --quiet || git commit -m "Refresh team history cache"
          git push
