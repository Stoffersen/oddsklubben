name: Oddsklubben Agent
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 0"
    - cron: "0 9 * * 0"
jobs:
  weekly:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Check Copenhagen 10:00
        if: github.event_name == 'schedule'
        run: |
          test "$(TZ=Europe/Copenhagen date +%H:%M)" = "10:00" || echo "SKIP=1" >> "$GITHUB_ENV"
      - name: Run weekly value agent
        if: env.SKIP != '1'
        env:
          FIVE_DOLLAR_FOOTBALL_API_KEY: ${{ secrets.FIVE_DOLLAR_FOOTBALL_API_KEY }}
        run: python -m src.agent
