name: Oddsklubben Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 0"

jobs:
  test-live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Test live football feed
        env:
          FIVE_DOLLAR_FOOTBALL_API_KEY: ${{ secrets.FIVE_DOLLAR_FOOTBALL_API_KEY }}
        run: python -m src.agent
