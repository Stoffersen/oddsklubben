name: Finance regression checks
on:
  pull_request:
    branches: [mobile-round-entry]
  push:
    branches: [mobile-round-entry]
permissions:
  contents: read
jobs:
  finance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all Python regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
