name: Mobile app preview
on:
  push:
    branches: [mobile-round-entry]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages-publishing
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Verify mobile navigation and static assets
        run: |
          test -f index.html
          test -f ture.html
          test -f sw.js
          grep -Fq 'href="ture.html">🏟️ Kampe vi har set' index.html
          grep -Fq 'class="archive-app-back" href="index.html"' ture.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
